wandb:
  project: rt-ppo-hc-3
  sync_tensorboard: true

experiment:
  # ENV
  env_name: HalfCheetah-v5
  n_envs: 1 # 4             
  total_timesteps: 1e6 
  dir_name: results
  render: false
  
  # PPO Parameters
  policy_type: MlpPolicy
  learning_rate: 3e-4  
  n_steps: 2048 # 256         
  n_minibatch: 32
  n_epochs: 10         
  gamma: 0.99          
  gae_lambda: 0.95     
  clip_range: 0.2      
  clip_range_vf: null
  normalize_advantage: true 
  ent_coef: 0.0            
  vf_coef: 0.5             
  max_grad_norm: 0.5       
  use_sde: false
  sde_sample_freq: -1
  rollout_buffer_class: null
  rollout_buffer_kwargs: null
  target_kl: null
  stats_window_size: 100
  tensorboard_log: null
  policy_kwargs: 
    net_arch: [64, 64]   
  verbose: 0
  seed: 2026
  device: cpu
  eval_freq: 10000
  n_eval_episodes: 10

  # Reusing Trajectories
  window_size: 1 
  on_policy_critic: true
  weight_type: naive # "naive" or "bh"
  sequential_window_training: false # true
  fresh_adv: false # true