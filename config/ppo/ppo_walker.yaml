wandb:
  project: rt-ppo-walker
  sync_tensorboard: true
  tags: null

experiment:
  # ENV
  env_name: Walker2d-v5
  n_envs: 1
  total_timesteps: 1_000_000
  dir_name: /storage/fis2/rt-deep-rl/results
  render: false

  # PPO Parameters
  policy_type: MlpPolicy
  learning_rate: 5.05041e-05
  n_steps: 512
  n_minibatch: 16
  n_epochs: 20
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 0.000585045
  vf_coef: 0.871923
  max_grad_norm: 1
  use_sde: false
  sde_sample_freq: -1
  rollout_buffer_class: null
  rollout_buffer_kwargs: null
  target_kl: null
  stats_window_size: 100
  tensorboard_log: null
  policy_kwargs:
    net_arch: [64, 64]
  verbose: 0
  seed: 5
  device: cpu

  # Reusing Trajectories
  window_size: 1
  on_policy_critic: true
  weight_type: naive
  sequential_window_training: false
  fresh_adv: false