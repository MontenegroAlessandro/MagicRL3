wandb:
  project: rt-ppo-ho
  sync_tensorboard: true
  tags: null

experiment:
  # ENV
  env_name: Hopper-v4
  n_envs: 1 # 4             
  total_timesteps: 1e6 
  dir_name: results
  render: false
  
  # PPO Parameters
  policy_type: MlpPolicy
  learning_rate: 9.80828e-05 
  n_steps: 512 # 256         
  n_minibatch: 16
  n_epochs: 5         
  gamma: 0.999          
  gae_lambda: 0.99     
  clip_range: 0.2      
  clip_range_vf: null
  normalize_advantage: true 
  ent_coef: 0.00229519         
  vf_coef: 0.835671            
  max_grad_norm: 0.7       
  use_sde: false
  sde_sample_freq: -1
  rollout_buffer_class: null
  rollout_buffer_kwargs: null
  target_kl: null
  stats_window_size: 100
  tensorboard_log: null
  policy_kwargs:
    net_arch:
      pi: [256, 256]
      vf: [256, 256]
  verbose: 0
  seed: 2026
  device: cpu

  # Reusing Trajectories
  window_size: 1 
  on_policy_critic: true
  weight_type: naive # "naive" or "bh"
  sequential_window_training: false # true
  fresh_adv: false # true