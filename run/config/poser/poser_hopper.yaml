wandb:
  project: poser
  entity: alessandro-montenegro-polimi
  sync_tensorboard: true
  tags: []

experiment:
  # General
  name: null        # if not null it will override the default name
  extra_name: null  # if not null it will be appended to the default name

  # ENV
  env_name: Hopper-v5
  n_envs: 1
  total_timesteps: 1e6
  dir_name: results
  render: false
  normalize_obs: true
  normalize_reward: false

  # PPO Parameters (config from the paper, Table 2 - for Hopper-v5 hand-picked,
  # not taken from RL Zoo: it matches the SB3 defaults except for gamma)
  policy_type: MlpPolicy
  learning_rate: 3e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.999                 # differs from default (0.99)
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: false
  sde_sample_freq: -1
  rollout_buffer_class: null
  rollout_buffer_kwargs: null
  target_kl: null
  stats_window_size: 100
  tensorboard_log: null
  policy_kwargs:
    log_std_init: 0.0
    net_arch: [64, 64]
    ortho_init: true
    activation_fn: tanh

  # Logging / evaluation
  verbose: 0
  seed: 2026
  device: cpu
  eval_freq: 10_000
  n_eval_episodes: 50

  # Poser-specific parameters
  window_size: null  # maximum window size
  weight_type: null  # uniform, kl, tv, renyi, clip fraction
  weighted_critic: false  # true: weight per-window critic losses with POSER weights
  batch_sampling: null  # balanced, random
  weight_discard_threshold: null  # threshold for discarding weights
  optimization_stopping_threshold: null  # threshold for stopping optimization
  optimization_stopping_strategy: null


hydra:
  run:
    dir: ${experiment.dir_name}/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
