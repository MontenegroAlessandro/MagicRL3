wandb:
  project: poser
  entity: alessandro-montenegro-polimi
  sync_tensorboard: true
  tags: []

experiment:
  # General
  name: null        # if not null it will override the default name
  extra_name: null  # if not null it will be appended to the default name

  # ENV
  env_name: HalfCheetah-v5
  n_envs: 1
  total_timesteps: 1e6
  dir_name: results
  render: false
  normalize_obs: true
  normalize_reward: false

  # PPO Parameters (tuned config from the paper, Table 2)
  policy_type: MlpPolicy
  learning_rate: 2.06e-5       # differs from default (3e-4)
  n_steps: 512                 # differs from default (2048)
  batch_size: 64
  n_epochs: 20                 # differs from default (10)
  gamma: 0.98                  # differs from default (0.99)
  gae_lambda: 0.92             # differs from default (0.95)
  clip_range: 0.1              # differs from default (0.2)
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 4.02e-4            # differs from default (0.0)
  vf_coef: 0.581               # differs from default (0.5)
  max_grad_norm: 0.8           # differs from default (0.5)
  use_sde: false
  sde_sample_freq: -1
  rollout_buffer_class: null
  rollout_buffer_kwargs: null
  target_kl: null
  stats_window_size: 100
  tensorboard_log: null
  policy_kwargs:
    log_std_init: -2.0         # differs from default (0.0)
    net_arch: [256, 256]       # differs from default ([64, 64])
    ortho_init: false          # differs from default (true)
    activation_fn: tanh

  # Logging / evaluation
  verbose: 0
  seed: 2026
  device: cpu
  eval_freq: 10_000
  n_eval_episodes: 50

  # Poser-specific parameters
  window_size: null  # maximum window size
  weight_type: null  # uniform, kl, tv, renyi, clip fraction
  weighted_critic: false  # true: weight per-window critic losses with POSER weights
  batch_sampling: null  # balanced, random
  weight_discard_threshold: null  # threshold for discarding weights
  optimization_stopping_threshold: null  # threshold for stopping optimization
  optimization_stopping_strategy: null


hydra:
  run:
    dir: ${experiment.dir_name}/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
