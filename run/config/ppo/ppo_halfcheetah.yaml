wandb:
  project: rebuttal
  entity: alessandro-montenegro-polimi
  sync_tensorboard: true
  tags: ["HalfCheetah-v5"]

experiment:
  # ENV
  env_name: HalfCheetah-v5
  n_envs: 1
  total_timesteps: 1e6
  dir_name: results
  render: false
  normalize_obs: true
  normalize_reward: false

  # PPO Parameters (tuned config from the paper, Table 2)
  policy_type: MlpPolicy
  learning_rate: 2.06e-5       # differs from default (3e-4)
  n_steps: 512                 # differs from default (2048)
  batch_size: 64
  n_minibatches: null
  n_epochs: 20                 # differs from default (10)
  gamma: 0.98                  # differs from default (0.99)
  gae_lambda: 0.92             # differs from default (0.95)
  clip_range: 0.1              # differs from default (0.2)
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 4.02e-4            # differs from default (0.0)
  vf_coef: 0.581               # differs from default (0.5)
  max_grad_norm: 0.8           # differs from default (0.5)
  use_sde: false
  sde_sample_freq: -1
  rollout_buffer_class: null
  rollout_buffer_kwargs: null
  target_kl: null
  stats_window_size: 100
  tensorboard_log: null
  policy_kwargs:
    log_std_init: -2.0         # differs from default (0.0)
    net_arch: [256, 256]       # differs from default ([64, 64])
    ortho_init: false          # differs from default (true)
    activation_fn: tanh

  # Logging / evaluation
  verbose: 0
  seed: 2026
  device: cpu
  eval_freq: 10_000
  n_eval_episodes: 50

  # Reusing Trajectories
  window_size: 1
  on_policy_critic: true
  weight_type: naive
  sequential_window_training: false
  fresh_adv: false
  balanced_batches: false
  on_policy_masking: false
  geppo_clip: false

  # Adaptive LR
  adaptive_lr: false
  adaptive_lr_alpha: 0.03
  adaptive_lr_beta: 0.5

hydra:
  run:
    dir: ${experiment.dir_name}/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
