wandb:
  project: rebuttal
  entity: alessandro-montenegro-polimi
  sync_tensorboard: true
  tags: []

experiment:
  # ENV
  env_name: HalfCheetah-v5
  n_envs: 1              
  total_timesteps: 1e6 
  dir_name: results
  render: false
  normalize_obs: true
  normalize_reward: false
  balanced_batches: false
  
  # PPO Parameters
  policy_type: MlpPolicy
  learning_rate: 3e-4  
  n_steps: 2048 
  batch_size: null        
  n_minibatch: 32
  n_epochs: 10         
  gamma: 0.99          
  gae_lambda: 0.95     
  clip_range: 0.2      
  clip_range_vf: null
  normalize_advantage: true 
  ent_coef: 0.0            
  vf_coef: 0.5             
  max_grad_norm: 0.5       
  use_sde: false
  sde_sample_freq: -1
  rollout_buffer_class: null
  rollout_buffer_kwargs: null
  target_kl: null
  stats_window_size: 100
  tensorboard_log: null
  policy_kwargs: 
    log_std_init: 0.0
    net_arch: [64, 64]
    ortho_init: true
    activation_fn: tanh
  verbose: 0
  seed: 2026
  device: cpu
  eval_freq: 10_000
  n_eval_episodes: 50
  on_policy_masking: false
  geppo_clip: false
  # Adaptive LR (GePPO Alg. 1): applied as a multiplicative scale on top of the
  # base SB3 schedule from learning_rate (equivalent to the paper's recursive
  # eta update only if learning_rate is constant; with a decaying schedule the
  # effective LR is decay * scale).
  adaptive_lr: false
  adaptive_lr_alpha: 0.03
  adaptive_lr_beta: 0.5

  # Reusing Trajectories
  window_size: 1 
  on_policy_critic: true
  weight_type: naive 
  sequential_window_training: false
  fresh_adv: false

hydra:
  run:
    dir: ${experiment.dir_name}/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}