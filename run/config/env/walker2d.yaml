# @package experiment
# Tuned config from the paper, Table 2.
env_name: Walker2d-v5
n_envs: 1
total_timesteps: 1e6
normalize_obs: true
normalize_reward: false

policy_type: MlpPolicy
learning_rate: 5.05e-5       # differs from default (3e-4)
n_steps: 512                 # differs from default (2048)
batch_size: null  # alternative to n_minibatches; takes precedence when not null
n_minibatches: 16             # differs from default (32)
n_epochs: 20                 # differs from default (10)
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.1              # differs from default (0.2)
clip_range_vf: null
normalize_advantage: true
ent_coef: 5.85e-4            # differs from default (0.0)
vf_coef: 0.872               # differs from default (0.5)
max_grad_norm: 1.0           # differs from default (0.5)
use_sde: false
sde_sample_freq: -1
policy_kwargs:
  log_std_init: 0.0
  net_arch: [64, 64]
  ortho_init: true
  activation_fn: tanh
