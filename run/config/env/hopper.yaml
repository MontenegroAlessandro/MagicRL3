# @package experiment
# Config from the paper, Table 2 - for Hopper-v5 hand-picked, not taken from RL Zoo:
# it matches the SB3 defaults except for gamma.
env_name: Hopper-v5
n_envs: 1
total_timesteps: 1e6
normalize_obs: true
normalize_reward: false

policy_type: MlpPolicy
learning_rate: 3e-4
n_steps: 2048
batch_size: 64
n_epochs: 10
gamma: 0.999                 # differs from default (0.99)
gae_lambda: 0.95
clip_range: 0.2
clip_range_vf: null
normalize_advantage: true
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
use_sde: false
sde_sample_freq: -1
policy_kwargs:
  log_std_init: 0.0
  net_arch: [64, 64]
  ortho_init: true
  activation_fn: tanh
