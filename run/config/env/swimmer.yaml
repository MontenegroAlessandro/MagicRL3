# @package experiment
# Tuned config from the paper, Table 2.
env_name: Swimmer-v5
n_envs: 4                    # differs from default (1)
total_timesteps: 1e6
normalize_obs: true
normalize_reward: false

policy_type: MlpPolicy
learning_rate: 6e-4          # differs from default (3e-4)
n_steps: 1024                # differs from default (2048)
batch_size: 256              # differs from default (64)
n_minibatches: null  # alternative to batch_size; ignored unless batch_size is null
n_epochs: 10
gamma: 0.9999                # differs from default (0.99)
gae_lambda: 0.98             # differs from default (0.95)
clip_range: 0.2
clip_range_vf: null
normalize_advantage: true
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
use_sde: false
sde_sample_freq: -1
policy_kwargs:
  log_std_init: 0.0
  net_arch: [64, 64]
  ortho_init: true
  activation_fn: tanh
