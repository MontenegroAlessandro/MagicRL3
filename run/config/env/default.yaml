# @package experiment
# Template for a new environment: SB3 default hyperparameters, no tuning applied.
env_name: null
n_envs: 1
total_timesteps: 1e6
normalize_obs: true
normalize_reward: false

policy_type: MlpPolicy
learning_rate: 3e-4
n_steps: 2048
batch_size: null  # alternative to n_minibatches; takes precedence when not null
n_minibatches: 32
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
clip_range_vf: null
normalize_advantage: true
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
use_sde: false
sde_sample_freq: -1
policy_kwargs:
  log_std_init: 0.0
  net_arch: [64, 64]
  ortho_init: true
  activation_fn: tanh
