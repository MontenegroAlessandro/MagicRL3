defaults:
  - env: halfcheetah
  - _self_

wandb:
  project: poser
  entity: alessandro-montenegro-polimi
  sync_tensorboard: true
  tags: []

experiment:
  # General
  name: null        # if not null it will override the default name
  extra_name: null  # if not null it will be appended to the default name
  dir_name: results
  render: false

  # SB3 plumbing shared across environments
  rollout_buffer_class: null
  rollout_buffer_kwargs: null
  target_kl: null
  stats_window_size: 100
  tensorboard_log: null

  # Logging / evaluation
  verbose: 0
  seed: 2026
  device: cpu
  eval_freq: 10_000
  n_eval_episodes: 50

  # Poser-specific parameters (override freely from the command line)
  window_size: null  # maximum window size
  weight_type: null  # uniform, variance-based (defaults to uniform if null)
  weighted_critic: false  # true: weight per-window critic losses with POSER weights
  batch_sampling: null  # balanced, random
  weight_discard_threshold: null  # threshold for discarding weights
  ess_decay_threshold: null  # in (0, 1]; stop the epoch loop once any window's ESS_i(theta)/ESS_i(theta_k) drops below this. null disables early stopping entirely (no target_kl fallback)
  discard_policy: oldest  # oldest, highest_decay -- which window discard_window() evicts when ess_decay_threshold triggers

hydra:
  run:
    dir: ${experiment.dir_name}/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
