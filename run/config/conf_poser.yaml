defaults:
  - env: halfcheetah
  - _self_

wandb:
  project: poser
  entity: alessandro-montenegro-polimi
  sync_tensorboard: true
  tags: []

experiment:
  # General
  name: null        # if not null it will override the default name
  extra_name: null  # if not null it will be appended to the default name
  dir_name: results
  render: false

  # SB3 plumbing shared across environments
  rollout_buffer_class: null
  rollout_buffer_kwargs: null
  target_kl: null
  stats_window_size: 100
  tensorboard_log: null

  # Logging / evaluation
  verbose: 0
  seed: 2026
  device: cpu
  eval_freq: 10_000
  n_eval_episodes: 50

  # Poser-specific parameters (override freely from the command line)
  window_size: 1  # values: integer >= 1;
  weight_type: uniform  # values: uniform, d2_rad, d2; d2_rad uses sqrt(N_i/d2_i), d2 uses N_i/d2_i
  weighted_critic: false  # values: true, false
  batch_sampling: balanced  # values: balanced, random;
  weight_discard_threshold: null  # values: null or float
  psr_threshold: null  # values: null or float >= 0; null disables PSR early stopping
  discard_policy: oldest  # values: oldest, highest_decay
  clip_range_adaptation: none  # values: none, weighted, weighted_geppo

hydra:
  run:
    dir: ${experiment.dir_name}/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
