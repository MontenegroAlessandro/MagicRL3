name: zdpg

sigma: 0.05              # Action-perturbation radius (mu in the paper); no action noise otherwise.
mode: standard           # standard (ZDPG) | symmetric (ZDPG-S, eq. 6's two-sided form)
sampling_mode: normal    # normal | sphere, over the d_A action dimensions
horizon_mode: auto       # auto | finite | geometric
# auto -> finite (H = min(env time limit, n_steps), t ~ Unif{0..H-1}; gamma = 1 allowed)
#   when gamma = 1 or the env has a time limit, else geometric (the paper's infinite-horizon
#   discounted setting, needs gamma < 1; n_steps is then only a safety cap).
# batch_size (number of samples per update) is not set here on purpose -- like FDPG it
# equals experiment.n_envs, so run.py derives it.
