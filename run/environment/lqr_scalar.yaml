# Scalar LQR, A = B = Q = R = 1: the classic 1-D benchmark of the policy-gradient
# literature, and the only system on which the env's closed-form gradients
# (grad_K, grad_Sigma, grad_mixed) are defined. Marginally stable open loop.
#   optimal return: -13.4836 (H = 50, gamma = 1), -13.4604 (gamma = 0.99)
#   optimal gain (gamma = 0.99): K* = -0.6153
env_name: LQR-v0
env_kwargs:
  A: 1.0
  B: 1.0
  Q: 1.0
  R: 1.0
  state_dim: 1
  action_dim: 1
  noise: 0.0
  init_dist: uniform
  init_bound: 5.0
  max_episode_steps: 50
n_steps: 50
policy_kwargs:
  net_arch: []
