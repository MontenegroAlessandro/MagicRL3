defaults:
  - algo@experiment.algo: reinforce
  - _self_

wandb:
  project: reinforce
  sync_tensorboard: true
  tags: []

experiment:
  # Environment
  env_name: CartPole-v1
  n_envs: 20
  total_timesteps: 1_000_000
  dir_name: results
  render: false
  # normalize_obs/normalize_reward only apply to REINFORCE. FDPG's perturbed-env pool
  # bypasses VecNormalize (see run.py), so these are ignored (with a warning) when
  # algo=fdpg -- normalizing would desync the perturbed rollouts from the reference one.
  normalize_obs: true
  normalize_reward: false

  # Shared policy-gradient hyperparameters (algo-specific ones live under algo:)
  policy_type: MlpPolicy
  learning_rate: 1e-3
  n_steps: 1000           # maximum trajectory horizon (hard cap)
  gamma: 1
  max_grad_norm: null
  # Exploration
  use_sde: false
  sde_sample_freq: -1

  # Logging / evaluation
  stats_window_size: 100
  eval_freq: null # 10_000
  n_eval_episodes: 50
  verbose: 0
  seed: 2026
  device: cpu

  # Policy architecture
  policy_kwargs:
    net_arch: [64, 64]
    activation_fn: tanh
    log_std_init: 0.0
    ortho_init: true
    learn_std: false
