defaults:
  - algo@experiment.algo: reinforce
  - _self_
  # Optional environment preset (run/environment/*.yaml), merged over experiment: after
  # _self_ so it overrides the defaults below, e.g. environment@experiment=lqr_toy_2x2.
  - environment@experiment: null

# Hydra >=1.2 defaults job.chdir to False, so the script no longer runs from a
# fresh per-run output directory. Without this, every run (and every job inside
# a -m sweep) keeps the launch cwd, so the relative experiment.dir_name below
# resolves to the same absolute folder for all of them, flattening every run's
# output together instead of isolating it per run/job.
hydra:
  job:
    chdir: true

wandb:
  project: det-pg
  sync_tensorboard: true
  tags: [debug, gpomdp, swimmer]

experiment:
  # Environment
  env_name: Swimmer-v5
  # Forwarded to gym.make for every environment the run builds -- the training and
  # evaluation envs and the side pools FDPG/ZDPG create. Use it for parametric envs
  # such as LQR-v0. From the command line the whole dict is replaced with "++", e.g.
  #   '++experiment.env_kwargs={state_dim:2,action_dim:2,max_episode_steps:50}'
  env_kwargs: {}
  n_envs: 10
  total_timesteps: 5_000_000
  dir_name: results
  render: false
  # Normalization applies to REINFORCE/GPOMDP. FDPG's side pool bypasses it;
  # BastaniFD needs fixed transforms for its +/- evaluations. For both FD methods
  # these flags are ignored with a warning (see run.py).
  normalize_obs: false
  normalize_reward: false

  # Shared policy-gradient hyperparameters (algo-specific ones live under algo:)
  policy_type: MlpPolicy
  learning_rate: 1e-3
  n_steps: 1000           # maximum trajectory horizon (hard cap)
  gamma: 1
  max_grad_norm: null
  # Exploration
  use_sde: false
  sde_sample_freq: -1

  # Logging / evaluation
  stats_window_size: 100
  eval_freq: 10_000
  n_eval_episodes: 25
  verbose: 0
  seed: 2026
  device: cpu

  # Policy architecture
  policy_kwargs:
    net_arch: [32,32]
    activation_fn: tanh
    log_std_init: 0.0
    ortho_init: true
    learn_std: false
